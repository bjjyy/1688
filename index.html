<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071224">
  <title>澳门开奖趋势参考</title>
  <style>
    :root{--bg:#071224;--panel:#101f38;--panel2:#172a47;--text:#f6f8ff;--muted:#9cafcb;--gold:#ffc94a;--red:#ed3f4f;--green:#18a66a;--blue:#3579e9}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#17325d 0,#071224 44%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
    .app{width:min(100%,920px);margin:auto;padding:9px 10px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.brand{font-size:17px;font-weight:900}.tag{font-size:9px;color:#ffe49a;background:#6b4e13;border:1px solid #a8791f;padding:3px 7px;border-radius:99px}
    .card{background:linear-gradient(145deg,rgba(23,42,71,.96),rgba(12,28,51,.96));border:1px solid rgba(153,185,232,.15);box-shadow:0 15px 35px rgba(0,0,0,.22);border-radius:18px}
    .latest{text-align:center;padding:10px 8px 11px}.eyebrow{color:#a9bddb;font-size:10px}.issue{font-size:19px;font-weight:900;margin:3px 0 1px}.time{font-size:10px;color:var(--muted);margin-bottom:8px}
    .balls{display:flex;align-items:flex-start;justify-content:center;gap:7px}.plus{font-size:24px;font-weight:900;margin:11px 1px 0;color:#ff6b70}.ballwrap{display:flex;flex-direction:column;align-items:center;gap:5px}.ball{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:21px;font-weight:900;box-shadow:inset 0 0 0 3px rgba(255,255,255,.14),0 6px 14px rgba(0,0,0,.25)}.animal{font-size:12px;font-weight:700}.red{background:linear-gradient(145deg,#ff5965,#c91f35)}.green{background:linear-gradient(145deg,#2bc17d,#0e7d50)}.blue{background:linear-gradient(145deg,#5595ff,#225bc1)}
    .section-title{display:flex;align-items:end;justify-content:space-between;margin:9px 4px 5px}.section-title h2{font-size:13px;margin:0}.section-title span{font-size:9px;color:var(--muted)}
    .history{overflow:hidden}.row{padding:5px 7px;border-bottom:1px solid rgba(180,200,230,.11)}.row:last-child{border:0}.rowhead{display:flex;justify-content:space-between;font-size:8px;color:var(--muted);margin-bottom:3px}.mini-balls{display:flex;justify-content:center;gap:5px}.mini{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-weight:850;font-size:11px}.mini-plus{align-self:center;color:#ff7880;font-size:12px;font-weight:900}.mini-animal{font-size:8px;line-height:1;font-weight:700}.special{outline:1px solid var(--gold);outline-offset:1px}
    .recommendations{display:grid;grid-template-columns:1fr 1fr;gap:7px}.rec{padding:9px}.rec-head{display:flex;align-items:center;justify-content:space-between;gap:6px}.rec h3{font-size:12px;margin:0 0 2px}.rec p{font-size:8px;color:var(--muted);margin:0 0 6px;line-height:1.35}.copy-btn{border:0;border-radius:99px;padding:3px 8px;background:#2c5ea6;color:#fff;font-size:9px;white-space:nowrap}.copy-btn:active{transform:scale(.96)}.pick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.pick{width:30px;height:30px;justify-self:center;border-radius:50%;display:grid;place-items:center;background:#f5f7ff;color:#10203a;font-weight:900;font-size:13px;box-shadow:0 3px 8px rgba(0,0,0,.25)}.zodiacs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.zodiac{min-height:38px;border-radius:9px;background:linear-gradient(145deg,#ffe083,#e7a91d);color:#342200;display:grid;place-items:center;font-size:18px;font-weight:900}.basis{margin-top:6px;padding:5px;border-radius:7px;background:rgba(255,255,255,.045);font-size:8px;line-height:1.35;color:#aebed5}
    .backtest{grid-column:1/-1;padding:8px 9px}.backtest h3{font-size:12px;margin:0 0 4px}.bt-row{display:grid;grid-template-columns:61px 1fr;gap:3px 6px;align-items:center;padding:4px 1px;border-top:1px solid rgba(180,200,230,.1);font-size:8px}.bt-issue{grid-row:1/3;color:#9fb2d0;line-height:1.45}.bt-line{display:flex;align-items:center;gap:3px;min-width:0}.bt-label{width:25px;flex:none;color:#7f95b5}.bt-num,.bt-z{min-width:17px;height:17px;padding:0 3px;border-radius:4px;display:inline-grid;place-items:center;background:#243a5c;color:#dce8fa;font-weight:800}.bt-z{min-width:20px}.bt-num.hit,.bt-z.hit{background:#16895b;color:white;box-shadow:0 0 0 1px #57e2a0}.bt-result{color:#ffbd65;margin-left:2px;white-space:nowrap}
    .status{text-align:center;color:#7f95b5;font-size:8px;margin:6px 0}.notice{text-align:center;color:#7186a3;font-size:8px;line-height:1.35;padding:0 8px}.notice b{color:#9fb0c8}.refresh{border:0;border-radius:99px;padding:4px 8px;background:#203b64;color:#cfe0ff;font-size:9px}
    @media(max-width:620px){.recommendations{grid-template-columns:1fr 1fr}.ball{width:38px;height:38px;font-size:17px}.balls{gap:4px}.plus{font-size:18px}.rec p,.basis{display:none}}
    @media(max-width:380px){.ball{width:34px;height:34px;font-size:15px}.animal{font-size:9px}.mini-balls{gap:3px}.pick{width:27px;height:27px;font-size:12px}.bt-row{grid-template-columns:55px 1fr;gap:3px}.bt-num,.bt-z{min-width:15px;height:16px;padding:0 2px}}
    @media(min-width:700px) and (orientation:landscape){.app{display:grid;grid-template-columns:1.04fr .96fr;gap:15px;align-items:start}.top,.notice,.status{grid-column:1/-1}.latest{grid-column:1}.right{grid-column:2;grid-row:2}.history-wrap{grid-column:1}.recommendations{grid-column:2;grid-row:3;grid-template-columns:1fr}.section-title{margin-top:10px}}
  </style>
</head>
<body><main class="app">
  <header class="top"><div class="brand">走势参考</div><div class="tag">近100期 · 反追冷</div></header>
  <section class="card latest" id="latest"><div class="eyebrow">上期开奖结果</div><div class="issue">读取中…</div></section>
  <div class="history-wrap"><div class="section-title"><h2>最近6期</h2><button class="refresh" id="refresh">刷新数据</button></div><section class="card history" id="history"></section></div>
  <section class="recommendations right">
    <article class="card rec"><div class="rec-head"><h3>下期特别号码参考</h3><button class="copy-btn" id="copyNumbers">复制</button></div><p>最近30期最少波色中随机选10个，同一期内保持固定</p><div class="pick-grid" id="numberPicks"></div><div class="basis" id="numberBasis"></div></article>
    <article class="card rec"><h3>下期平特生肖参考</h3><p>从下一期7个位置中，筛选近期整体活跃度较高的3个生肖</p><div class="zodiacs" id="zodiacPicks"></div><div class="basis" id="zodiacBasis"></div></article>
    <article class="card backtest"><h3>最近6期推荐结果</h3><div id="backtest"></div></article>
  </section>
  <div class="status" id="status"></div>
  <footer class="notice"><b>仅供数据观察与娱乐，不构成投注建议。</b><br>彩票开奖是随机事件，历史频率不能提高下一期命中概率，请勿将本页面用于赌博决策。</footer>
</main>
<script>
const API_YEAR=y=>`https://history.macaumarksix.com/history/macaujc2/y/${y}`;
const fallback=[
 {expect:'2026264',openTime:'2026-09-21 21:32:32',openCode:'10,06,08,31,22,24,21',wave:'blue,green,red,blue,green,red,green',zodiac:'雞,牛,豬,鼠,雞,羊,狗'},
 {expect:'2026263',openTime:'2026-09-20 21:32:32',openCode:'44,28,03,02,24,13,09',wave:'green,green,blue,red,red,red,blue',zodiac:'豬,兔,龍,蛇,羊,馬,狗'},
 {expect:'2026262',openTime:'2026-09-19 21:32:32',openCode:'38,22,33,47,36,07,30',wave:'green,green,green,blue,blue,red,red',zodiac:'蛇,雞,狗,猴,羊,鼠,牛'},
 {expect:'2026261',openTime:'2026-09-18 21:32:32',openCode:'06,25,43,46,29,47,24',wave:'green,blue,green,red,red,blue,red',zodiac:'牛,馬,鼠,雞,虎,猴,羊'},
 {expect:'2026260',openTime:'2026-09-17 21:32:32',openCode:'25,26,44,32,06,48,20',wave:'blue,blue,green,green,green,blue,blue',zodiac:'馬,蛇,豬,豬,牛,羊,豬'},
 {expect:'2026259',openTime:'2026-09-16 21:32:32',openCode:'43,33,49,36,19,30,22',wave:'green,green,green,blue,red,red,green',zodiac:'鼠,狗,馬,羊,鼠,牛,雞'}
];
const cachedNumbers=[5,46,30,35,31,23,45,4,32,21], cachedZodiacs=['兔','馬','鼠'];
const split=(s)=>String(s).split(','); const pad=n=>String(n).padStart(2,'0');
const waveNumbers={red:[1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46],blue:[3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48],green:[5,6,11,16,17,21,22,27,28,32,33,38,39,43,44,49]};
let currentNumberPicks=[];
function seededRandom(seed){let x=(Number(seed)||1)>>>0;return()=>{x=(x+0x6D2B79F5)|0;let t=Math.imul(x^x>>>15,1|x);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function waveLogicPicks(prior,seed){const recent=prior.slice(0,30),c={red:0,green:0,blue:0};recent.forEach(x=>{const w=split(x.wave)[6];if(w in c)c[w]++});const min=Math.min(...Object.values(c)),cold=Object.keys(c).filter(w=>c[w]===min),pool=cold.flatMap(w=>waveNumbers[w]),rand=seededRandom(seed),copy=[...pool];for(let i=copy.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return {nums:copy.slice(0,10),cold,counts:c}}
function balls(item,small=false){const ns=split(item.openCode),ws=split(item.wave),zs=split(item.zodiac);return ns.map((n,i)=>`${i===6?'<span class="'+(small?'mini-plus':'plus')+'">+</span>':''}<div class="ballwrap"><div class="${small?'mini':'ball'} ${ws[i]||'red'} ${small&&i===6?'special':''}">${pad(n)}</div><div class="${small?'mini-animal':'animal'}">${zs[i]}</div></div>`).join('')}
function score(data){
 const d=data.slice(0,100), count={},recent={},gap={}; for(let n=1;n<=49;n++){count[n]=0;recent[n]=0;gap[n]=100}
 d.forEach((x,i)=>{const n=+split(x.openCode)[6];count[n]++;if(i<20)recent[n]++;if(gap[n]===100)gap[n]=i});
 const nums=Object.keys(count).map(Number).sort((a,b)=>((count[b]*1.1+recent[b]*2.4+Math.max(0,10-gap[b])*.25-Math.pow(gap[b],.65)*.18)-(count[a]*1.1+recent[a]*2.4+Math.max(0,10-gap[a])*.25-Math.pow(gap[a],.65)*.18))).slice(0,10);
 const all={},r20={};d.forEach((x,i)=>split(x.zodiac).forEach(z=>{all[z]=(all[z]||0)+1;if(i<20)r20[z]=(r20[z]||0)+1}));
 const zs=Object.keys(all).sort((a,b)=>(all[b]+2.2*(r20[b]||0))-(all[a]+2.2*(r20[a]||0))).slice(0,3);return {nums,zs,count,recent,all,r20};
}
function render(data,live){const latest=data[0];document.getElementById('latest').innerHTML=`<div class="eyebrow">上期开奖结果</div><div class="issue">第${latest.expect}期</div><div class="time">${latest.openTime}</div><div class="balls">${balls(latest)}</div>`;
 document.getElementById('history').innerHTML=data.slice(0,6).map(x=>`<div class="row"><div class="rowhead"><b>第${x.expect}期</b><span>${x.openTime}</span></div><div class="mini-balls">${balls(x,true)}</div></div>`).join('');
 const s=data.length>=20?score(data):{zs:cachedZodiacs},wavePick=data.length>=30?waveLogicPicks(data,Number(latest.expect)+1):{nums:cachedNumbers,cold:[],counts:{}};currentNumberPicks=wavePick.nums;document.getElementById('numberPicks').innerHTML=currentNumberPicks.map(n=>`<div class="pick">${pad(n)}</div>`).join('');document.getElementById('zodiacPicks').innerHTML=s.zs.map(z=>`<div class="zodiac">${z}</div>`).join('');
 const waveName={red:'红波',green:'绿波',blue:'蓝波'};document.getElementById('numberBasis').textContent=wavePick.cold.length?`近30期最少：${wavePick.cold.map(w=>waveName[w]).join('、')}；同一期号码固定。`:'近30期最少波色中固定随机10个。';document.getElementById('zodiacBasis').textContent='近100期全部7个位置频率，并提高近20期权重。';
 const bt=data.slice(0,6).map((x,i)=>{const prior=data.slice(i+1,i+101);if(prior.length<30)return null;const old=score(prior),wp=waveLogicPicks(prior,x.expect),special=+split(x.openCode)[6],allZ=split(x.zodiac),numHit=wp.nums.includes(special),zHits=old.zs.filter(z=>allZ.includes(z));const ns=wp.nums.map(n=>`<span class="bt-num ${n===special?'hit':''}">${pad(n)}</span>`).join('');const zs=old.zs.map(z=>`<span class="bt-z ${allZ.includes(z)?'hit':''}">${z}</span>`).join('');return `<div class="bt-row"><span class="bt-issue">${String(x.expect).slice(-4)}期<br>开${pad(special)}</span><div class="bt-line"><span class="bt-label">特号</span>${ns}<span class="bt-result">${numHit?'中':'未中'}</span></div><div class="bt-line"><span class="bt-label">平特</span>${zs}<span class="bt-result">中${zHits.length}</span></div></div>`}).filter(Boolean).join('');document.getElementById('backtest').innerHTML=bt||'<div class="bt-row"><span>联网更新后显示</span></div>';
 document.getElementById('status').textContent=live?`已同步最新数据 · ${new Date().toLocaleString()}`:'当前显示内置数据 · 联网后点“刷新数据”可更新';}
async function getYear(y){const r=await fetch(API_YEAR(y),{cache:'no-store'});if(!r.ok)throw Error();const j=await r.json();return Array.isArray(j.data)?j.data:[]}
async function load(){const btn=document.getElementById('refresh');btn.disabled=true;btn.textContent='更新中…';try{const y=new Date().getFullYear();const parts=await Promise.allSettled([getYear(y),getYear(y-1)]),seen=new Set();const data=parts.flatMap(x=>x.status==='fulfilled'?x.value:[]).sort((a,b)=>Number(b.expect)-Number(a.expect)).filter(x=>{if(seen.has(x.expect))return false;seen.add(x.expect);return true}).slice(0,106);if(!data.length)throw Error();render(data,true)}catch(e){render(fallback,false)}finally{btn.disabled=false;btn.textContent='刷新数据'}}
document.getElementById('refresh').addEventListener('click',load);render(fallback,false);load();
document.getElementById('copyNumbers').addEventListener('click',async function(){const text=currentNumberPicks.map(pad).join(' ');try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}this.textContent='已复制';setTimeout(()=>this.textContent='复制',1200)});
</script></body></html>
